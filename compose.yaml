services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PSWRD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - grafinya_pg:/var/lib/postgresql/data
    networks:
      - app_network
  
  grafinya:
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      - postgres
    networks:
      - app_network
    build:
      dockerfile: Dockerfile

volumes:
  grafinya_pg:
    name: 
      grafinya_pg

networks:
  app_network:
    driver: bridge